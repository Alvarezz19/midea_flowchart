<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>美的暖通流程图生成工具</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>
            <div class="brand-title">暖通流程图生成</div>
            <div class="brand-subtitle" id="project-subtitle">等待加载</div>
          </div>
        </div>
        <div class="toolbar">
          <select id="sample-select" aria-label="示例项目"></select>
          <label class="file-button">
            上传 JSON
            <input id="file-input" type="file" accept=".json,application/json" />
          </label>
          <button id="paste-button" class="ghost-button">粘贴 JSON</button>
          <input id="search-input" type="search" placeholder="搜索点位或模块" />
          <div class="segmented" aria-label="视图切换">
            <button class="active" data-view="overview">总览</button>
            <button data-view="detail">详情</button>
            <button data-view="raw">原始</button>
          </div>
          <button id="export-button" class="ghost-button">导出 JSON</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar">
          <section class="panel">
            <h2>项目结构</h2>
            <div id="tab-list" class="nav-list"></div>
          </section>
          <section class="panel issue-panel">
            <h2>命名异常</h2>
            <div id="issue-list" class="issue-list"></div>
          </section>
        </aside>

        <section class="canvas-wrap">
          <button id="back-button" class="canvas-back hidden">返回总览</button>
          <div id="edge-mode-controls" class="edge-mode-controls hidden" aria-label="连线显示模式">
            <button class="active" data-edge-mode="primary">业务链路</button>
            <button data-edge-mode="support">原始连线</button>
          </div>
          <div id="search-results" class="search-results hidden"></div>
          <svg id="flow-canvas" role="img" aria-label="流程图画布"></svg>
        </section>

        <aside class="details">
          <section class="panel detail-panel">
            <h2 id="detail-title">详情</h2>
            <div id="detail-content"></div>
          </section>
        </aside>
      </main>

      <footer class="statusbar">
        <span id="status-text">未加载</span>
        <span id="stats-text"></span>
      </footer>
    </div>
    <div id="paste-dialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="paste-title">
      <div class="dialog">
        <div class="dialog-header">
          <h2 id="paste-title">粘贴 JSON</h2>
          <button id="paste-close" class="icon-button" aria-label="关闭">×</button>
        </div>
        <textarea id="paste-textarea" spellcheck="false" placeholder="粘贴美的编程平台导出的 JSON 数组"></textarea>
        <div class="dialog-actions">
          <button id="paste-submit">解析</button>
          <button id="paste-cancel" class="ghost-button">取消</button>
        </div>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
